name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ticketing
          POSTGRES_PASSWORD: ticketing
          POSTGRES_DB: ticketing
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ticketing -d ticketing"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15

    env:
      DATABASE_URL: postgresql+asyncpg://ticketing:ticketing@localhost:5432/ticketing
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci-test-secret-please-replace-32-chars' }}
      STRIPE_SECRET_KEY: sk_test_dummy_for_ci
      STRIPE_WEBHOOK_SECRET: whsec_dummy_for_ci
      HOLD_TTL_SEC: 600
      DEBUG: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check app tests

      - name: Type check
        run: mypy app

      - name: Migrations
        run: alembic upgrade head

      - name: Migrations are reversible
        run: |
          alembic downgrade base
          alembic upgrade head

      - name: Tests
        run: pytest -q